
name: Frontend Continuous Deployment

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "k8s/frontend.yaml"
      - ".github/workflows/frontend-cd.yaml"
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: ${{ secrets.ECR_FRONTEND_REPOSITORY }}
  EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push frontend image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build \
            --build-arg REACT_APP_API_URL="${{ vars.REACT_APP_API_URL }}" \
            -t "$REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA}" ./frontend
          docker push "$REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA}"

      - name: Configure kubectl for EKS
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"

      - name: Deploy frontend to EKS
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          kubectl set image deployment/frontend frontend="$REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA}"
          kubectl rollout status deployment/frontend --timeout=180s
